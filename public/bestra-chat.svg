<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4" />
      <stop offset="100%" style="stop-color:#34A853" />
    </linearGradient>
    <linearGradient id="icon_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF; stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded Square Background with Vibrant Gradient -->
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bg_grad)" />
  
  <!-- Stylized "Mesh/Connection" Icon with Rounded Geometries -->
  <g filter="url(#shadow)">
    <!-- Central Node -->
    <circle cx="512" cy="512" r="120" fill="white" />
    
    <!-- Orbiting Nodes / Connections -->
    <circle cx="300" cy="350" r="70" fill="url(#icon_grad)" />
    <circle cx="724" cy="350" r="70" fill="url(#icon_grad)" />
    <circle cx="512" cy="750" r="70" fill="url(#icon_grad)" />
    
    <!-- Connection Lines with Rounded Ends -->
    <line x1="512" y1="512" x2="300" y2="350" stroke="white" stroke-width="40" stroke-linecap="round" />
    <line x1="512" y1="512" x2="724" y2="350" stroke="white" stroke-width="40" stroke-linecap="round" />
    <line x1="512" y1="512" x2="512" y2="750" stroke="white" stroke-width="40" stroke-linecap="round" />
  </g>
</svg>
