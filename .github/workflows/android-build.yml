name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --prefer-online --no-audit

      - name: Generate Icons
        run: npx tauri icon public/bestra-chat.svg

      - name: Initialize Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Add Android Permissions
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          # Function to add permission if missing
          add_perm() {
            if ! grep -q "$1" "$MANIFEST"; then
              sed -i "/<application/i \    <uses-permission android:name=\"$1\" />" "$MANIFEST"
            fi
          }
          add_perm "android.permission.INTERNET"
          add_perm "android.permission.ACCESS_NETWORK_STATE"
          add_perm "android.permission.ACCESS_WIFI_STATE"
          add_perm "android.permission.CHANGE_WIFI_MULTICAST_STATE"
          add_perm "android.permission.CAMERA"
          add_perm "android.permission.RECORD_AUDIO"
          add_perm "android.permission.MODIFY_AUDIO_SETTINGS"
          add_perm "android.permission.ACCESS_FINE_LOCATION"
          add_perm "android.permission.ACCESS_COARSE_LOCATION"

      - name: Build APK
        run: npx tauri android build --debug
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
