[package]
name = "bestra-chat"
version = "0.1.0"
description = "bestra-chat"
authors = ["Mrabet Fakhri"]
license = "MIT"
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Serialization and logging
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"

# Tauri dependencies
tauri = { version = "2.11.2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-geolocation = "2"

# Reticulum-rs (Targeting v0.2.0)
reticulum-rs = "0.2.0"

# Database dependencies - Consolidated to rusqlite
rusqlite = { version = "0.31.0", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Yggdrasil dependencies
yggdrasil = { git = "https://github.com/Revertron/Yggdrasil-ng.git", package = "yggdrasil", default-features = false }
ironwood = { git = "https://github.com/Revertron/Yggdrasil-ng.git", package = "ironwood", default-features = false }
toml = "1"

# Miscellaneous utilities
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", features = ["avif"] }
audiopus = "0.3.0-rc.0"
ed25519-dalek = "2"
